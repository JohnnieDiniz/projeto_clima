<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <main class="container">
        <h1>Previsão do Tempo</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Digite o nome da cidade..."
                aria-label="Nome da cidade"
            >
            <button id="search-btn">Buscar</button>
            <!-- NOVO: Botão de GPS -->
            <button id="location-btn" title="Usar minha localização atual">📍</button>
        </div>

        <!-- NOVO: Container do Histórico -->
        <div id="history-container" class="history-container hidden">
            <p>Buscas recentes:</p>
            <div id="history-chips" class="history-chips"></div>
        </div>

        <section id="weather-result" class="weather-result" aria-live="polite">
            <!-- Dados do clima -->
        </section>
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Alternar Modo Escuro/Claro">🌙</button>

    <main class="container">
        <h1>Previsão do Tempo</h1>
        <button id="home-btn" class="home-btn hidden">Nova Busca</button>
    </main>

<script type="module" src="./assets/js/api.js"></script>
</body>
</html>
