<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="container">
        <h1>Previsão do Tempo</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Digite o nome da cidade (ex: São Paulo)"
                aria-label="Nome da cidade"
            >
            <button id="search-btn">Buscar</button>
        </div>

        <section id="weather-result" class="weather-result" aria-live="polite">
            <!-- Os dados do clima ou mensagens de erro aparecerão aqui -->
        </section>
    </main>

    <!-- ATENÇÃO: Nome do arquivo alterado para api.js -->
    <script src="assets/js/api.js"></script> 
</body>
</html>
